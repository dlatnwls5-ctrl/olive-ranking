<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올영 랭킹 디텍터</title>
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2129; --muted: #6b7280; --line: #e5e7eb;
  --accent: #ff4f81; --accent-weak: #ffe4ec; --up: #e5484d; --down: #3b82f6; --new: #12a150;
  --row-hover: #fafafa; --sel: #fff5f8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --panel: #1a1d23; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3038;
    --accent: #ff6b96; --accent-weak: #3a1f29; --up: #ff6b6b; --down: #60a5fa; --new: #34d399;
    --row-hover: #20242b; --sel: #2a1d23;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0 8px 0 0; }
header h1 span { color: var(--accent); }
select, input[type=search], button { font: inherit; color: inherit; }
select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.muted { color: var(--muted); }
main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px 20px 40px; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip b { margin-left: 4px; }
.chip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar input[type=search] { flex: 1; min-width: 180px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:hover td { background: var(--row-hover); }
tr.sel td { background: var(--sel); }
.rank { font-weight: 800; font-size: 18px; width: 44px; text-align: center; }
.chg { font-weight: 700; white-space: nowrap; width: 64px; }
.up { color: var(--up); } .down { color: var(--down); } .same { color: var(--muted); }
.badge-new { background: var(--new); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 700; }
.thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--line); display: block; }
.brand { font-size: 12px; color: var(--muted); }
.name { font-weight: 500; }
.name a { color: inherit; text-decoration: none; }
.name a:hover { text-decoration: underline; }
.cat { font-size: 12px; color: var(--muted); white-space: nowrap; }
.price { white-space: nowrap; text-align: right; }
.price .org { font-size: 12px; color: var(--muted); text-decoration: line-through; }
.price .pct { color: var(--accent); font-weight: 700; margin-right: 4px; }
.vid { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin: 1px; cursor: pointer; }
.vid:hover { border-color: var(--accent); color: var(--accent); }
svg.spark { display: block; }
.side h2 { font-size: 15px; margin: 0 0 8px; }
.side .card { padding: 12px; margin-bottom: 16px; }
.job { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
.job:last-child { border-bottom: 0; }
.job .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { font-size: 12px; }
.st.running { color: var(--accent); } .st.done { color: var(--new); } .st.error { color: var(--up); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent;
  border-radius: 50%; animation: s 1s linear infinite; margin-right: 4px; vertical-align: -1px; }
@keyframes s { to { transform: rotate(360deg); } }
.dropped li { font-size: 13px; margin: 3px 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line);
  padding: 12px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
.bar .count { font-weight: 700; }
.bar label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 50; }
.modal.show { display: flex; }
.modal video { max-height: 90vh; max-width: 92vw; border-radius: 12px; background: #000; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 700px) {
  .hide-m { display: none; }
  header, main, .bar { padding-left: 16px; padding-right: 16px; }
  .toolbar input[type=search] { flex-basis: 100%; min-width: 0; }
  .toolbar select { flex: 1; min-width: 0; }
  th, td { padding: 8px 4px; }
  .rank { width: 28px; font-size: 16px; }
  .chg { width: 48px; }
  .thumb { width: 44px; height: 44px; }
  .name { font-size: 13px; word-break: break-all; }
  .price { font-size: 12px; }
  .price .pct { display: block; margin: 0; }
}
</style>
</head>
<body>
<header>
  <h1>올영 <span>랭킹</span> 디텍터</h1>
  <select id="date"></select>
  <span id="prevInfo" class="muted"></span>
  <span style="flex:1"></span>
  <span class="muted" style="font-size:12px">매일 수집한 올리브영 판매 랭킹 1~100위</span>
</header>

<main>
  <section>
    <div class="chips" id="chips"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="브랜드·상품명 검색">
      <select id="cat"><option value="">전체 카테고리</option></select>
      <select id="sort">
        <option value="rank">순위순</option>
        <option value="up">상승폭 큰 순</option>
        <option value="down">하락폭 큰 순</option>
        <option value="disc">할인율 높은 순</option>
      </select>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th>순위</th><th>변동</th><th class="hide-m">추이</th><th></th><th>상품</th>
          <th class="hide-m">카테고리</th><th style="text-align:right">가격</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>조건에 맞는 상품이 없습니다.</div>
    </div>
  </section>

  <aside class="side">
    <h2>순위권 이탈 <span class="muted" id="dropCnt"></span></h2>
    <div class="card"><ul class="dropped" id="dropped" style="margin:0;padding-left:18px"></ul></div>
  </aside>
</main>



<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => n == null ? "" : n.toLocaleString("ko-KR") + "원";
let data = null, filter = "all";

async function loadRanking(date) {
  if (!date) date = (await (await fetch("data/latest.json", {cache: "no-store"})).json()).date;
  data = await (await fetch("data/" + date + ".json", {cache: "no-store"})).json();
  const sel = $("#date");
  sel.innerHTML = data.dates.slice().reverse().map(d => `<option ${d === data.date ? "selected" : ""}>${d}</option>`).join("");
  $("#prevInfo").textContent = data.prev ? `${data.prev} 대비` : (data.date ? "첫 수집일 (비교 데이터 없음)" : "랭킹 데이터 없음");
  const cats = [...new Set(data.items.map(i => i.cat1).filter(Boolean))].sort();
  const cur = $("#cat").value;
  $("#cat").innerHTML = `<option value="">전체 카테고리</option>` + cats.map(c => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
  $("#dropCnt").textContent = data.prev ? `(${data.dropped.length})` : "";
  $("#dropped").innerHTML = data.prev
    ? (data.dropped.map(d => `<li><span class="muted">${d.rank}위</span> ${esc(d.brand)} · ${esc(d.name)}</li>`).join("") || "<li class='muted'>없음</li>")
    : "<li class='muted'>비교할 이전 날짜가 없습니다</li>";
  render();
}

function chips() {
  const it = data.items;
  const c = {
    all: it.length,
    new: it.filter(i => i.isNew).length,
    up: it.filter(i => i.change >= 10).length,
    down: it.filter(i => i.change <= -10).length,
  };
  const L = {all: "전체", new: "🆕 신규 진입", up: "🔥 급상승 ▲10+", down: "하락 ▼10+"};
  $("#chips").innerHTML = Object.keys(L).map(k =>
    `<span class="chip ${filter === k ? "on" : ""}" data-f="${k}">${L[k]}<b>${c[k]}</b></span>`).join("");
}

function spark(h) {
  const W = 90, H = 30, n = h.length;
  const vals = h.filter(r => r != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 10) { const m = (hi + lo) / 2; lo = Math.max(1, m - 5); hi = lo + 10; }  // 작은 변동도 보이게, 최소 10계단 범위
  const pts = h.map((r, i) => r == null ? null : [n === 1 ? W / 2 : 4 + i * (W - 8) / (n - 1), 3 + (r - lo) * (H - 6) / (hi - lo)]);
  let d = "", pen = false;
  pts.forEach(p => { if (!p) { pen = false; return; } d += (pen ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); pen = true; });
  const last = pts[pts.length - 1];
  const tip = data.histDates.map((dt, i) => `${dt}: ${h[i] ?? "-"}위`).join("\n");
  return `<svg class="spark" width="${W}" height="${H}"><title>${tip}</title>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)"/>` : ""}</svg>`;
}

function chg(i) {
  if (i.isNew) return `<span class="badge-new">NEW</span>`;
  if (i.change == null) return `<span class="same">–</span>`;
  if (i.change > 0) return `<span class="up">▲${i.change}</span>`;
  if (i.change < 0) return `<span class="down">▼${-i.change}</span>`;
  return `<span class="same">－</span>`;
}

function visible() {
  const q = $("#q").value.trim().toLowerCase(), cat = $("#cat").value;
  let it = data.items.filter(i =>
    (filter === "all" || (filter === "new" && i.isNew) || (filter === "up" && i.change >= 10) ||
     (filter === "down" && i.change <= -10)) &&
    (!cat || i.cat1 === cat) &&
    (!q || (i.brand + " " + i.name).toLowerCase().includes(q)));
  const s = $("#sort").value;
  const val = i => i.isNew ? 1000 : (i.change ?? 0);
  if (s === "up") it.sort((a, b) => val(b) - val(a) || a.rank - b.rank);
  if (s === "down") it.sort((a, b) => (a.change ?? 0) - (b.change ?? 0) || a.rank - b.rank);
  if (s === "disc") it.sort((a, b) => disc(b) - disc(a) || a.rank - b.rank);
  return it;
}
const disc = i => i.priceOrg && i.priceCur ? Math.round((1 - i.priceCur / i.priceOrg) * 100) : 0;

function render() {
  chips();
  const it = visible();
  $("#empty").hidden = it.length > 0;
  $("#rows").innerHTML = it.map(i => {
    const d = disc(i);
    return `<tr data-no="${i.goodsNo}">
      <td class="rank">${i.rank}</td>
      <td class="chg">${chg(i)}${i.prevRank && !i.isNew ? `<div class="muted" style="font-size:11px;font-weight:400">전일 ${i.prevRank}위</div>` : ""}</td>
      <td class="hide-m">${spark(i.history)}</td>
      <td><img class="thumb" src="${esc(i.thumb)}" loading="lazy" alt=""></td>
      <td><div class="brand">${esc(i.brand)}</div><div class="name"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.name)}</a></div></td>
      <td class="cat hide-m">${esc(i.cat1)}</td>
      <td class="price">${d ? `<div class="org">${won(i.priceOrg)}</div><span class="pct">${d}%</span>` : ""}<b>${won(i.priceCur)}</b></td></tr>`;
  }).join("");
}

$("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { filter = c.dataset.f; render(); } });
["#q", "#cat", "#sort"].forEach(s => $(s).addEventListener("input", render));
$("#date").addEventListener("change", e => loadRanking(e.target.value));

loadRanking().catch(() => { $("#rows").innerHTML = ""; $("#empty").hidden = false; $("#empty").textContent = "랭킹 데이터를 불러오지 못했습니다."; });
</script>
</body>
</html>
