name: 매일 랭킹 수집

on:
  schedule:
    - cron: "0 1 * * *"   # 매일 01:00 UTC = 한국 시간 오전 10시 (GitHub 사정으로 몇십 분 늦어질 수 있음)
  workflow_dispatch:       # GitHub 화면에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.65.2
      - name: 한글 글꼴 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk xvfb
      - name: 랭킹 수집
        run: xvfb-run --auto-servernum python scrape.py
      - run: python build.py
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rankings data
          git diff --cached --quiet && exit 0
          git commit -m "자동 수집 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push
